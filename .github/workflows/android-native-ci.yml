name: Android native storage verification

on:
  pull_request:
    paths:
      - 'lib/storage/**'
      - 'lib/domain/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android test platform
        run: flutter create --platforms=android --org au.parmtech --project-name tong_ledger .
      - name: Apply Android backup exclusions
        run: python3 scripts/prepare_android.py
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Detect available Android emulator acceleration
        id: acceleration
        shell: bash
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "disable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::warning::KVM unavailable; attempting a software emulator."
          echo "disable=true" >> "$GITHUB_OUTPUT"
      - name: Execute native SQLCipher and secure-storage integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: ${{ steps.acceleration.outputs.disable }}
          emulator-boot-timeout: 900
          script: flutter test integration_test -d emulator-5554
