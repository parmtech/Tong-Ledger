name: Android native storage verification

on:
  pull_request:
    paths:
      - 'lib/storage/**'
      - 'lib/domain/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android test platform
        run: flutter create --platforms=android --org au.parmtech --project-name tong_ledger .
      - name: Apply Android backup exclusions
        run: python3 scripts/prepare_android.py
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Execute native SQLCipher and secure-storage integration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test -d emulator-5554
